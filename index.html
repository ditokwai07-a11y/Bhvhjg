<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-800 w-full max-w-lg">
        <h1 class="text-3xl font-extrabold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
            Grok AI Generator
        </h1>
        
        <div id="input-section">
            <textarea id="prompt" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500 outline-none transition" rows="4" placeholder="Descreva o vídeo que você deseja criar..."></textarea>
            
            <div class="flex gap-3 mt-4">
                <button onclick="gerarVideo()" id="btn-gerar" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-900/20">
                    Gerar Vídeo
                </button>
            </div>
        </div>

        <div id="status-area" class="mt-8 hidden">
            <div id="loading" class="hidden flex flex-col items-center py-10">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12 mb-4"></div>
                <p class="text-slate-400 animate-pulse">Conectando à IA... preparando o frame 0...</p>
            </div>

            <div id="result-box" class="hidden"></div>
        </div>
    </div>

    <script>
        async function gerarVideo() {
            const prompt = document.getElementById('prompt').value;
            const statusArea = document.getElementById('status-area');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('result-box');
            const btn = document.getElementById('btn-gerar');

            if (!prompt) return alert("Digite algo primeiro!");

            // 1. Reset e Estado de Carregamento
            statusArea.classList.remove('hidden');
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                // Simulação de chamada de API (Substitua pela sua URL real)
                const response = await new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // Simulando erro aleatório para você ver como a interface reage
                        Math.random() > 0.3 ? resolve({ success: true }) : reject("Servidor ocupado");
                    }, 3000);
                });

                // 2. Estado de Sucesso
                loading.classList.add('hidden');
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `
                    <div class="text-center">
                        <div class="w-full h-48 bg-slate-800 rounded-xl mb-4 flex items-center justify-center text-green-400">Vídeo gerado com sucesso!</div>
                        <button onclick="location.reload()" class="text-sm text-slate-500 underline">Gerar outro</button>
                    </div>`;

            } catch (err) {
                // 3. Estado de Erro
                loading.classList.add('hidden');
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `
                    <div class="bg-red-900/20 border border-red-800 p-4 rounded-xl text-center">
                        <p class="text-red-400 font-bold">Erro: ${err}</p>
                        <p class="text-sm text-red-300 mt-1">Tente novamente em alguns segundos.</p>
                        <button onclick="location.reload()" class="mt-4 bg-red-600 px-4 py-2 rounded-lg text-sm">Tentar Novamente</button>
                    </div>`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
